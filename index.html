<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image grid layout</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="images">
      <img src="https://cdn.pixabay.com/photo/2025/05/02/15/58/flower-girl-9574211_1280.jpg" alt="image-a" class="image image-a" />
      <img
        src="https://cdn.pixabay.com/photo/2025/03/29/11/20/bee-9500879_1280.jpg"
        alt="image-b"
        class="image image-b"
      />
      <img src="https://cdn.pixabay.com/photo/2025/03/09/10/16/sunrise-9456871_1280.jpg" alt="image-c" class="image image-c" />
      <img
        src="https://cdn.pixabay.com/photo/2025/04/30/05/57/bay-9568512_1280.jpg"
        alt="image-d"
        class="image image-d"
      />
      <img src="https://cdn.pixabay.com/photo/2025/04/30/04/42/building-9568428_1280.jpg" alt="image-e" class="image image-e" />
      <img
        src="https://cdn.pixabay.com/photo/2025/03/11/09/51/woman-9461838_1280.jpg"
        alt="image-f"
        class="image image-f"
      />
      <img src="https://cdn.pixabay.com/photo/2024/04/22/16/38/buildings-8713025_1280.jpg" alt="image-g" class="image image-g" />
      <img
        src="https://cdn.pixabay.com/photo/2025/03/31/21/30/italy-9505446_1280.jpg"
        alt="image-h"
        class="image image-h"
      />
      <img src="https://cdn.pixabay.com/photo/2025/03/30/13/01/fairy-tale-9502808_1280.jpg" alt="image-i" class="image image-i" />
      <img
        src="https://cdn.pixabay.com/photo/2025/04/04/15/25/lonely-9513577_1280.jpg"
        alt="image-j"
        class="image image-j"
      />
    </div>
  </body>
</html>
